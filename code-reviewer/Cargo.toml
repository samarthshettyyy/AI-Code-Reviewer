[package]
name = "code-reviewer"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio         = { version = "1",    features = ["full"] }
reqwest       = { version = "0.12", features = ["json", "rustls-tls"] }
serde         = { version = "1",    features = ["derive"] }
serde_json    = "1"
anyhow        = "1"
walkdir       = "2"
colored       = "2"
indicatif     = "0.17"
tokio-retry   = "0.3"
dotenvy       = "0.15"
axum          = { version = "0.7", features = ["multipart"] }
tower-http    = { version = "0.5", features = ["cors"] }
tower         = "0.4"
